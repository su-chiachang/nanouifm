<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A55"/>
      <stop offset="1" stop-color="#121A2B"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FA8FF"/>
      <stop offset="1" stop-color="#2F7BEA"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CC4FF"/>
      <stop offset="1" stop-color="#4B93F5"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#FFB02E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS squircle tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g filter="url(#shadow)">
    <!-- folder back with tab -->
    <path d="M232 318 a36 36 0 0 1 36 -36 h160 a36 36 0 0 1 28 13 l30 37 h270 a36 36 0 0 1 36 36 v40 H232 Z" fill="url(#back)"/>
    <!-- folder front -->
    <rect x="232" y="372" width="560" height="400" rx="40" fill="url(#front)"/>
  </g>

  <!-- 2x2 pane grid on folder front -->
  <g>
    <rect x="272" y="412" width="232" height="152" rx="18" fill="url(#lit)"/>
    <rect x="520" y="412" width="232" height="152" rx="18" fill="#FFFFFF" fill-opacity="0.32"/>
    <rect x="272" y="580" width="232" height="152" rx="18" fill="#FFFFFF" fill-opacity="0.32"/>
    <rect x="520" y="580" width="232" height="152" rx="18" fill="#FFFFFF" fill-opacity="0.32"/>
  </g>

  <!-- list rows hint inside panes -->
  <g fill="#1B2A44" fill-opacity="0.55">
    <rect x="300" y="446" width="140" height="16" rx="8"/>
    <rect x="300" y="478" width="176" height="16" rx="8"/>
    <rect x="300" y="510" width="110" height="16" rx="8"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.75">
    <rect x="548" y="446" width="150" height="16" rx="8"/>
    <rect x="548" y="478" width="100" height="16" rx="8"/>
    <rect x="300" y="614" width="120" height="16" rx="8"/>
    <rect x="300" y="646" width="168" height="16" rx="8"/>
    <rect x="548" y="614" width="170" height="16" rx="8"/>
    <rect x="548" y="646" width="130" height="16" rx="8"/>
    <rect x="548" y="678" width="90" height="16" rx="8"/>
  </g>
</svg>
